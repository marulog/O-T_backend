apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

dependencies {
	implementation project(':modules:domain')
	implementation project(':modules:infra-db')
	implementation project(':modules:infra-redis')
	implementation project(':modules:infra-s3')
	implementation project(':modules:infra-mq')
	implementation project(':modules:common-core')
	implementation project(':modules:common-web')
	implementation project(':modules:common-security')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:rabbitmq'

	// ShedLock
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.10.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.10.0'
}

jacoco {
	toolVersion = '0.8.10'
}


test {
	useJUnitPlatform()
	finalizedBy(jacocoTestReport)
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
	sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
	classDirectories.setFrom(fileTree("$buildDir/classes/java/main") {
		exclude '**/generated/**'
	})
	executionData.setFrom(files("$buildDir/jacoco/test.exec"))
}
