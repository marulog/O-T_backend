spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: http://localhost/oauth/authorize
            token-uri: http://localhost/oauth/token
            user-info-uri: http://localhost/user/me
            user-name-attribute: id
  data:
    redis:
      password:
      timeout: 3000ms

kakao:
  unlink-url: http://localhost/kakao/unlink
  admin-key: test-admin-key

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiry: 1800000
  refresh-token-expiry: 1209600000

ai:
  base-url: http://localhost:8000
  timeout-ms: 5000
  timeout:
    mood-ms: 5000

gemini:
  api:
    url: http://localhost/gemini
    key: test-gemini-key
